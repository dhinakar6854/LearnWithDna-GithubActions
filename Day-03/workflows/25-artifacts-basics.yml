# 25 - Artifacts: moving FILES from one job to another
# File 20 moved a small string with outputs. Artifacts move real files —
# a compiled bundle, a test report, a screenshot, a log.
#
# The flow is always the same two actions:
#   actions/upload-artifact@v7    in the producing job
#   actions/download-artifact@v8  in the consuming job
#
# ⚠️ VERSION: the two actions are NOT on the same major number. Upload is on
#    v7, download is on v8 — they ship independently, so don't "fix" the
#    mismatch. Anything at or below upload@v5 / download@v6 runs on Node 20,
#    which GitHub now force-runs on Node 24 with a deprecation warning:
#      "Node.js 20 is deprecated. The following actions target Node.js 20
#       but are being forced to run on Node.js 24: actions/upload-artifact@v4"
#    That warning is the signal to bump the major. (Self-hosted runners need
#    2.327.1+ for the Node 24 builds — see file 34, later in the course.)
#    The v3 artifact actions were FULLY RETIRED on 30 January 2025 and fail
#    outright. Tutorials older than that are broken — check before you copy.
#
# THE RULES THAT STILL DEFINE ARTIFACTS (unchanged since v4):
#   * Artifacts are IMMUTABLE. Once uploaded, that name is finished. In v3
#     you could upload repeatedly to the same name and the files merged.
#     Now the SECOND upload to a name FAILS the job (unless you pass
#     `overwrite: true`). This is the #1 reason a migrated workflow breaks —
#     see file 26 for the matrix fix.
#   * Names must be UNIQUE within a run.
#   * An artifact is visible/downloadable as soon as its job finishes,
#     instead of only at the end of the whole run.
#
# NEWER SINCE THEN, worth knowing:
#   * upload v7 adds `archive: false` — upload ONE file as-is instead of
#     wrapping it in a zip, so the download is the plain file.
#   * download v8 verifies the SHA-256 digest and now FAILS on a mismatch by
#     default (`digest-mismatch: ignore|info|warn|error` to change that).
#
# ARTIFACT vs CACHE (say this out loud once and it sticks):
#   Cache    = "I could rebuild this, I just don't want to wait."
#   Artifact = "This IS the result. Losing it means losing the work."
#
# 📋 SETUP — this file runs `npm run build`, which only exists in the CURRENT
#    sample-app. If your practice repo was set up during Day 1 you have the
#    older copy and the build job dies with:
#        npm error Missing script: "build"
#    Fix: re-copy `sample-app/package.json` AND `sample-app/build.js` from the
#    course repo. You do NOT need to touch package-lock.json — adding a script
#    doesn't invalidate the lockfile, so `npm ci` still passes (which is exactly
#    why the failure lands on the build step and not the install step).
#
# WHAT TO OBSERVE: after the run, scroll to the bottom of the run summary
# page — there is an "Artifacts" box you can download in your browser.

name: 25 - Artifacts (upload / download)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sample-app/package-lock.json'

      - run: npm ci

      # Produces sample-app/dist/ — see sample-app/build.js
      - name: Build
        run: npm run build

      - name: Upload the build output
        uses: actions/upload-artifact@v7
        with:
          name: app-build                 # how later jobs and the UI refer to it
          path: sample-app/dist/          # ⚠️ relative to the REPO ROOT, always.
                                          # `defaults.run.working-directory` does
                                          # NOT apply to `uses:` steps (the working-directory rule).
          retention-days: 7               # default is 90; shorter = cheaper storage
          if-no-files-found: error        # 'warn' (default) hides a broken build

  test:
    needs: build                          # must wait — you cannot download from a
                                          # job that has not finished
    runs-on: ubuntu-latest
    steps:
      - name: Download the build output
        uses: actions/download-artifact@v8
        with:
          name: app-build                 # same name as the upload
          path: downloaded-build          # where to put it on THIS runner
                                          # (omit `path` and it lands in the CWD)

      - name: Prove the files crossed the machine boundary
        run: |
          echo "This is a brand-new runner. It has no repo checked out —"
          echo "only the files that came from the artifact:"
          ls -R downloaded-build
          cat downloaded-build/build-info.json

  # Artifacts are also how you rescue evidence from a FAILING run.
  publish-logs-on-failure:
    needs: [build, test]
    if: failure()                         # file 19 — only when something broke
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p logs
          echo "diagnostics for run ${{ github.run_id }}" > logs/debug.log
      - uses: actions/upload-artifact@v7
        with:
          name: failure-logs
          path: logs/
